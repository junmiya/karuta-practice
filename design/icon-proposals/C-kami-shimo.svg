<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- C: 上の句と下の句 — 2枚の札を重ねる（読札=藍、取札=生成り）。かな「う」「し」で上下を示す -->
  <rect width="512" height="512" rx="112" fill="#EAF2F9"/>
  <g transform="rotate(-12 256 256)">
    <rect x="84" y="108" width="168" height="282" rx="16" fill="#196AAB"/>
    <text x="168" y="292" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','YuMincho',serif" font-weight="700" font-size="120" fill="#FBF7EC">上</text>
  </g>
  <g transform="rotate(9 256 256)">
    <rect x="224" y="130" width="168" height="282" rx="16" fill="#000" opacity=".15" transform="translate(8 10)"/>
    <rect x="224" y="130" width="168" height="282" rx="16" fill="#FBF7EC"/>
    <rect x="238" y="144" width="140" height="254" rx="9" fill="none" stroke="#c62828" stroke-width="5"/>
    <text x="308" y="316" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','YuMincho',serif" font-weight="700" font-size="120" fill="#212121">下</text>
  </g>
  <circle cx="420" cy="96" r="22" fill="#FFCB05"/>
</svg>
